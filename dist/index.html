<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolsApp Lab</title>
    <link rel="stylesheet" href="./assets/css/index-ad9b37ed.css">
</head>
<body>
    <div id="app"></div>
    <script>
        // 第一性原理：为 Vue 引擎构建一个“零真空”执行环境
        window.__BASE_URL__ = "./";
        window.process = { env: { NODE_ENV: 'production' } };
        // 关键：强制伪装成一个已就绪的全局配置对象，防止 undefined is not iterable 报错
        window.config = { version: 'production', buildTime: Date.now() };
        
        const coreScripts = [
            './assets/js/vendor-4ed993c7.js',
            './assets/js/vue-vendor-4ed993c7.js',
            './assets/js/index-72aaa7da.js'
        ];

        // 顺序阻塞式注入：确保依赖链条物理咬合
        function inject(idx) {
            if (idx >= coreScripts.length) return;
            const s = document.createElement('script');
            s.src = coreScripts[idx];
            s.type = 'module';
            s.onload = () => {
                console.log(`Core ${idx} mounted.`);
                inject(idx + 1);
            };
            document.head.appendChild(s);
        }
        inject(0);
    </script>
</body>
</html>
