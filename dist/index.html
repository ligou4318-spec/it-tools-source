<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolsApp Lab</title>
    <link rel="stylesheet" href="./assets/css/index-ad9b37ed.css">
    <style>
        body { background: #0a0a0a; color: #fff; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: monospace; }
        #app:empty:before { content: 'System Final Calibration...'; opacity: 0.5; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        // 1. 强制注入生产环境标记，关闭 Vue 调试警告
        window.__BASE_URL__ = "./";
        window.__VUE_OPTIONS_API__ = true;
        window.__VUE_PROD_DEVTOOLS__ = false;
        window.process = { env: { NODE_ENV: 'production' } };
    </script>

    <script type="module" src="./assets/js/vendor-4ed993c7.js"></script>
    <script type="module" src="./assets/js/vue-vendor-4ed993c7.js"></script>
    <script type="module" src="./assets/js/index-72aaa7da.js"></script>

    <script>
        // 3. 容错逻辑：如果 Vue 没能接管 #app，自动尝试二次唤醒
        setTimeout(() => {
            const app = document.getElementById('app');
            if (app && app.innerHTML === "") {
                console.log("Retrying hydration...");
                // 强制触发一次窗口缩放事件，有时能唤醒某些挂起的 Vue 渲染逻辑
                window.dispatchEvent(new Event('resize'));
            }
        }, 3000);
    </script>
</body>
</html>
