<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-Tools Lab</title>
    <link rel="stylesheet" href="./assets/css/index-ad9b37ed.css">
    <script>
        // 2. 第一性原理：为 Vue 引擎预设所有必须的“生存参数”
        window.__BASE_URL__ = "./";
        window.process = { env: { NODE_ENV: 'production' } };
        // IT-Tools 启动锚点：强制设置默认语言，防止在读取 LocalStorage 时卡死
        localStorage.setItem('it-tools-locale', 'en');
    </script>
</head>
<body>
    <div id="app"></div>

    <script type="module" src="./assets/js/vendor-4ed993c7.js"></script>
    <script type="module" src="./assets/js/vue-vendor-4ed993c7.js"></script>
    <script type="module" src="./assets/js/index-72aaa7da.js"></script>

    <script>
        // 5. 暴力唤醒逻辑：如果 3 秒后 innerHTML 还是空的，说明 Vue 挂载了但没渲染
        setTimeout(() => {
            const app = document.getElementById('app');
            if (app && app.innerHTML === "") {
                console.warn("Detection: Engine Stall. Triggering Manual Hydration...");
                window.dispatchEvent(new Event('load'));
                window.dispatchEvent(new Event('resize')); // 强制触发某些响应式组件的计算
            }
        }, 3000);
    </script>
</body>
</html>
