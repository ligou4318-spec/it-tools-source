<body>
    <div id="app"></div>
    <script>
        // 核心路径锁定
        window.__BASE_URL__ = "./";
        
        // 监控 Vue 挂载：如果 5 秒后 innerHTML 还是空的，说明某个零件丢了

            const app = document.getElementById('app');
            if (app && app.innerHTML === "") {
                console.error("Hydration Timeout: Check network tab for missing .js files");
                app.innerHTML = "<div style='color:red'>Boot Failure: Script Mismatch</div>";
            }
        }, 5000);
    </script>
