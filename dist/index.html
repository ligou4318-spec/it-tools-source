<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-Tools | High Performance</title>
    <link rel="stylesheet" href="./assets/css/index-fd2d99c0.css">
    <script>
        // 1. 物理环境注入
        window.__BASE_URL__ = "./";
        window.process = { env: { NODE_ENV: "production" } };
        try { localStorage.setItem('it-tools-locale', 'en'); } catch(e) {}

        // 2. 暴力点火逻辑：通过 fetch 强行执行模块代码
        async function forceIgnition() {
            const scripts = [
                './assets/js/vendor-4ed993c7.js',
                './assets/js/vue-vendor-4ed993c7.js',
                './assets/js/index-72aaa7da.js'
            ];
            
            console.log("Starting Force Ignition Sequence...");
            for (const src of scripts) {
                try {
                    const resp = await fetch(src);
                    const code = await resp.text();
                    const script = document.createElement('script');
                    script.type = 'module';
                    // 核心技巧：利用 Blob 逃避服务器 MIME 检查
                    const blob = new Blob([code], { type: 'application/javascript' });
                    script.src = URL.createObjectURL(blob);
                    document.head.appendChild(script);
                    await new Promise(r => setTimeout(r, 50)); // 给解析器喘息时间
                } catch (e) {
                    console.error(`Failed to ignite: ${src}`, e);
                }
            }
        }
        window.addEventListener('DOMContentLoaded', forceIgnition);
    </script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
