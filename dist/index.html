<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT-Tools | Professional Developer Toolkit</title>
    <link rel="stylesheet" href="./assets/css/index-fd2d99c0.css">
    <script>
        window.__BASE_URL__ = "./";
        window.process = { env: { NODE_ENV: "production" } };
        try { localStorage.setItem('it-tools-locale', 'en'); } catch(e) {}
    </script>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        const load = (src) => {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.type = 'module';
                s.crossOrigin = 'anonymous';
                s.src = src;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        };

        async function boot() {
            try {
                // 1. 先加载核心依赖 (注意：这里的文件名必须与你 dist/assets/js/ 文件夹下一致)
                await load('./assets/js/vendor-4ed993c7.js');
                await load('./assets/js/vue-vendor-4ed993c7.js');
                // 2. 最后加载主入口
                await load('./assets/js/index-72aaa7da.js');
                console.log("Core Engine Ignited.");
            } catch (e) {
                console.error("Boot error: File name mismatch or 404. Checking assets folder...");
            }
        }
        boot();
    </script>
</body>
</html>
